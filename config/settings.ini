# mangpx - GPX File Manipulator - Configuration File
# =====================================================
#
# This file contains all user-configurable settings for mangpx.
# Edit values as needed and restart the application for changes to take effect.
#
# Format: key = value
# Comments: Lines starting with # or ;
# Booleans: true/false, yes/no, 1/0, on/off (case-insensitive)
#
# Date: 2026-09-20
# Version: 1.0.0

# =====================================================
# APPLICATION SETTINGS
# =====================================================
[Application]

# Application name (used in window title, about dialogs)
# Can be customized for branding purposes
app_name = mangpx

# Application version
version = 1.0.0

# Show debug information in console
debug = false

# =====================================================
# MAP SETTINGS
# =====================================================
[Map]

# Default mbtiles file to use for map background
# File location: mbtiles/{default_mbtiles}
# Supports zoom levels Z10-Z16
default_mbtiles = Sweden-Raster-Z10-Z16.mbtiles

# Fallback mbtiles files if primary not available (comma-separated)
# Tries each file in order until one is found
fallback_mbtiles = OSM-OpenCPN2-Baltic.mbtiles,OSM-OpenCPN-Baltic.mbtiles

# Initial zoom level when loading a track
# Range: 10-16 (matching mbtiles zoom levels)
initial_zoom_level = 13

# Default map center (latitude, longitude) for initial view
# Swedish archipelago area
default_map_center_lat = 57.5
default_map_center_lon = 12.0

# Track path color (RGB hex format: RRGGBB)
# Default: FF0000 (red)
# Examples: 0000FF (blue), 00FF00 (green), FFFFFF (white)
track_path_color = FF0000

# Track path width in pixels
# Default: 3
track_path_width = 3

# Selected track path color (RGB hex format: RRGGBB)
# Default: FF3232 (bright red)
selected_track_path_color = FF3232

# Selected trackpoint color (RGB hex format: RRGGBB)
# Default: FFFF00 (yellow)
selected_trackpoint_color = FFFF00

# Show turning points on map (trackpoints as circles)
# Default: true
show_turning_points = true

# Turning point color (RGB hex format: RRGGBB)
# Default: FFFF00 (yellow)
turning_point_color = FFFF00

# Selected turning point color (RGB hex format: RRGGBB)
# Default: 0000FF (blue)
selected_turning_point_color = 0000FF

# Turning point size (radius in pixels)
# Default: 4
turning_point_size = 4

# =====================================================
# COORDINATE SETTINGS
# =====================================================
[Coordinates]

# Format for displaying coordinates on screen
# Options: dms (default), decimal
# 
# DMS format example:   57°30'45.5"N 12°15'30.2"E
# Decimal format example: 57.5126°N 12.2584°E
coordinate_format = dms

# Number of decimal places to show in decimal format
decimal_places = 4

# Number of decimal places to show for DMS seconds component
dms_seconds_decimals = 1

# =====================================================
# FILE SETTINGS
# =====================================================
[File]

# Create backup of original file before saving modifications
# Backup files use extension: .bak
# Example: track.gpx -> track.gpx.bak
create_backup = true

# Backup file extension (without the dot)
# Will be appended: original_file + backup_extension
backup_extension = bak

# Remember last opened file directory
# Saves the directory path for convenience on next open
remember_last_directory = true

# =====================================================
# USER INTERFACE SETTINGS
# =====================================================
[UI]

# Main window size on startup (pixels)
window_width = 1400
window_height = 900

# Main window position on startup (pixels, -1 = system default)
window_x = -1
window_y = -1

# Restore window size/position from last session
remember_window_size = true

# Table row height in pixels
table_row_height = 25

# Enable keyboard shortcuts display in menus
show_keyboard_shortcuts = true

# =====================================================
# PERFORMANCE SETTINGS
# =====================================================
[Performance]

# Maximum trackpoints to display without pagination warning
# If track has more points than this, warn user about potential lag
max_trackpoints_no_warning = 5000

# Maximum file size to load without warning (MB)
# Files larger than this show a confirmation dialog
max_file_size_warning = 25

# Maximum file size to load (MB)
# Files larger than this are rejected
max_file_size_error = 100

# Maximum undo/redo stack size (number of operations)
# Older operations are discarded when limit reached
max_undo_redo_stack_size = 50

# Maximum undo/redo history size in memory (MB)
# History is cleared if memory limit exceeded
max_history_memory_mb = 500

# =====================================================
# LOGGING SETTINGS
# =====================================================
[Logging]

# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
# DEBUG: Most verbose, includes all internal operations
# INFO: General information and important events
# WARNING: Warning messages and potential issues
# ERROR: Error messages only
# CRITICAL: Critical errors only
log_level = INFO

# Log file location (relative to project root)
log_file = ./mangpx.log

# Maximum log file size (MB) before rotation
log_file_max_size = 10

# Number of old log files to keep during rotation
log_file_backup_count = 5

# =====================================================
# GARMIN COMPATIBILITY SETTINGS
# =====================================================
[Garmin]

# GPX version to use for export
# Garmin devices support GPX 1.1
gpx_version = 1.1

# Validate Garmin compatibility before saving
# Ensures exported files will import into Garmin devices
validate_before_save = true

# Show Garmin import guide after successful save (optional)
show_import_guide = false

# =====================================================
# ADVANCED SETTINGS
# =====================================================
[Advanced]

# Thread timeout for file operations (seconds)
file_operation_timeout = 30

# Thread timeout for map rendering (seconds)
map_render_timeout = 10

# Enable experimental features (if any)
experimental_features = false

# Maximum threads for background operations
max_threads = 4

# =====================================================
# NOTE FOR USERS
# =====================================================
#
# Do not manually edit this file while mangpx is running.
# Changes made while the application is running will be overwritten
# when it closes.
#
# If settings become corrupted, delete this file and restart mangpx
# to regenerate it with default values.
#
# For technical support, see doc/CONFIGURATION_GUIDE.md
#
