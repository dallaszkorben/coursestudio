[Application]
app_name = CourseStudio
version = 1.0.0
window_title = {app_name} - GPX File Manipulator v{version}
debug = false

[Map]
mbtiles_file = Sweden-Raster-Z10-Z16.mbtiles
default_mbtiles = Sweden-Raster-Z10-Z16.mbtiles
fallback_mbtiles = OSM-OpenCPN2-Baltic.mbtiles,OSM-OpenCPN-Baltic.mbtiles
initial_zoom_level = 13
default_map_center_lat = 57.5
default_map_center_lon = 12.0
track_path_color = FF0000
track_path_width = 3
selected_track_path_color = FF3232
selected_trackpoint_color = FFFF00
show_turning_points = true
last_show_turning_points = false
turning_point_color = FFFF00
selected_turning_point_color = 0000FF
turning_point_size = 4
selected_turning_point_size = 5

[Coordinates]
coordinate_format = dms
last_coordinate_format = decimal
decimal_places = 4
dms_seconds_decimals = 1

[File]
create_backup = true
backup_extension = bak
remember_last_directory = true

[UI]
window_width = 1400
window_height = 900
window_x = -1
window_y = -1
remember_window_size = true
table_row_height = 25
show_keyboard_shortcuts = true

[Performance]
max_trackpoints_no_warning = 5000
max_file_size_warning = 25
max_file_size_error = 100
max_undo_redo_stack_size = 50
max_history_memory_mb = 500

[Logging]
log_level = INFO
log_file = ./CourseStudio.log
log_file_max_size = 10
log_file_backup_count = 5

[Garmin]
gpx_version = 1.1
validate_before_save = true
show_import_guide = false

[Advanced]
file_operation_timeout = 30
map_render_timeout = 10
experimental_features = false
max_threads = 4

