Application:
  name: CourseStudio
  version: 1.0.0
  window_title: '{name} - GPX File Manipulator v{version}'
  window_width: 1400
  window_height: 900
  start_maximized: false
  debug: false
  project_root: ./
Appearance:
  MapDisplay:
    TrackPath:
      body:
        color: E97F49
        width: 5
      outline:
        color: '000676'
        width: 2
      colors:
        Red: FF0000
        Deep Pink: FF1493
        Magenta: FF00FF
        Hot Pink: FF69B4
        Coral: FF7F50
        Orange: FFA500
        Gold: FFD700
        Yellow: FFFF00
        Lime: 00FF00
        Spring Green: 00FF7F
        Turquoise: 40E0D0
        Cyan: 00FFFF
        Dodger Blue: 1E90FF
        Medium Blue: 0000CD
        Dark Blue: 00008B
        Navy: 000080
    Trackpoints:
      show: true
      GeneralPoints:
        body:
          color: FF0000
          size: 6
        outline:
          color: 000082
          size: 2
      SelectedPoints:
        body:
          color: 00008B
          size: 8
        outline:
          color: 00FF00
          size: 3
      DoubleSelectedPoints:
        body:
          color: 1E90FF
          size: 8
        outline:
          color: FFFF00
          size: 3
      colors:
        Red: FF0000
        Deep Pink: FF1493
        Hot Pink: FF69B4
        Coral: FF7F50
        Yellow: FFFF00
        Gold: FFD700
        Orange: FFA500
        Lime: 00FF00
        Spring Green: 00FF7F
        Turquoise: 40E0D0
        Cyan: 00FFFF
        Magenta: FF00FF
        Dodger Blue: 1E90FF
        Medium Blue: 0000CD
        Dark Blue: 00008B
        Navy: 000080
  Tiles:
    mbtiles_file: Sweden-Raster-Z10-Z16.mbtiles
    fallback_files:
    - OSM-OpenCPN2-Baltic.mbtiles
    - OSM-OpenCPN-Baltic.mbtiles
    initial_zoom: 13
    default_center:
      lat: 57.5
      lon: 12.0
CoordinatesDisplay:
  Format:
    coordinate_format: dms
    decimal_places: 4
    dms_seconds_decimals: 1
  TableDisplay:
    row_height: 25
    show_keyboard_shortcuts: true
FileHandling:
  Backup:
    create: true
    extension: bak
  RecentFiles:
    remember_last_directory: true
    max_recent_files: 10
  GpxExport:
    gpx_version: '1.1'
    validate_before_save: true
  DeleteConfirmation:
    require_delete_confirmation: false
Performance:
  TrackLoading:
    max_trackpoints_no_warning: 5000
    max_file_size_warning_mb: 25
    max_file_size_error_mb: 100
  UndoRedo:
    max_undo_redo_stack: 50
    max_history_memory_mb: 500
  Rendering:
    map_render_timer_ms: 100
Advanced:
  Debugging:
    log_level: INFO
    log_file: ./CourseStudio.log
    log_file_max_size_mb: 10
    log_backup_count: 5
    debug_mode: false
  Technical:
    file_operation_timeout_s: 30
    map_render_timeout_s: 10
    max_threads: 4
    experimental_features: false
  GarminDevice:
    show_import_guide: false
InternalState:
  Map:
    last_show_turning_points: false
  Coordinates:
    last_format: decimal
Map:
  last_state:
    show_turning_points: true
