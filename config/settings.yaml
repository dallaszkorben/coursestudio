application:
  name: CourseStudio
  version: 1.0.0
  window_title: '{name} - GPX File Manipulator v{version}'
  window_width: 1400
  window_height: 900
  start_maximized: false
  debug: false
  project_root: ./
appearance:
  map_display:
    track_path:
      body:
        color: FF7F50
        width: 5
      outline:
        color: '000000'
        width: 1
      colors:
        Red: FF0000
        Deep Pink: FF1493
        Magenta: FF00FF
        Hot Pink: FF69B4
        Coral: FF7F50
        Orange: FFA500
        Gold: FFD700
        Yellow: FFFF00
        Lime: 00FF00
        Spring Green: 00FF7F
        Turquoise: 40E0D0
        Cyan: 00FFFF
        Dodger Blue: 1E90FF
        Medium Blue: 0000CD
        Dark Blue: 00008B
        Navy: 000080
    trackpoints:
      show: true
      general_points:
        body:
          color: FF0000
          size: 6
        outline:
          color: 000082
          size: 2
      selected_points:
        body:
          color: 00008B
          size: 8
        outline:
          color: 00FF00
          size: 3
      double_selected_points:
        body:
          color: 1E90FF
          size: 8
        outline:
          color: FFFF00
          size: 3
      colors:
        Red: FF0000
        Deep Pink: FF1493
        Hot Pink: FF69B4
        Coral: FF7F50
        Yellow: FFFF00
        Gold: FFD700
        Orange: FFA500
        Lime: 00FF00
        Spring Green: 00FF7F
        Turquoise: 40E0D0
        Cyan: 00FFFF
        Magenta: FF00FF
        Dodger Blue: 1E90FF
        Medium Blue: 0000CD
        Dark Blue: 00008B
        Navy: 000080
      GeneralPoints:
        body:
          color: FFFF00
          size: 4
        outline:
          color: FFFFFF
          size: 1
      SelectedPoints:
        body:
          color: FF69B4
          size: 8
        outline:
          color: FFFFFF
          size: 1
      DoubleSelectedPoints:
        body:
          color: FF00FF
          size: 8
        outline:
          color: FFFFFF
          size: 1
    turning_points:
      show: false
    crosshair:
      enabled: true
      body:
        color: FF0000
        size: 28
      outline:
        color: 6505FF
        width: 1
  tiles:
    recent_mbtiles: /home/akoel/Projects/boat/general/Code/CourseStudio/mbtiles/Sweeden-Z6-Z15.mbtiles
    recent_zoom: 15
    recent_center:
      lat: 56.1652322834177
      lon: 15.6070876121521
    default_zoom: 15
    default_center:
      lat: 56.1687327785248
      lon: 15.5885910987854
coordinates_display:
  format:
    coordinate_format: dms
    decimal_places: 4
    dms_seconds_decimals: 1
  table_display:
    row_height: 25
    show_keyboard_shortcuts: true
file_handling:
  backup:
    create: true
    extension: bak
  recent_files:
    remember_last_directory: true
    max_recent_files: 10
  gpx_export:
    gpx_version: '1.1'
    validate_before_save: true
  delete_confirmation:
    require_delete_confirmation: false
performance:
  track_loading:
    max_trackpoints_no_warning: 5000
    max_file_size_warning_mb: 25
    max_file_size_error_mb: 100
  undo_redo:
    max_undo_redo_stack: 50
    max_history_memory_mb: 500
  rendering:
    map_render_timer_ms: 100
  prune_points:
    min_distance_m: 200
advanced:
  debugging:
    log_level: INFO
    log_file: ./CourseStudio.log
    log_file_max_size_mb: 10
    log_backup_count: 5
    debug_mode: false
  technical:
    file_operation_timeout_s: 30
    map_render_timeout_s: 10
    max_threads: 4
    experimental_features: false
  garmin_device:
    show_import_guide: false
internal_state:
  map:
    last_show_turning_points: false
  coordinates:
    last_format: decimal
map:
  last_state:
    show_turning_points: true
Coordinates:
  last_state:
    format: dms
